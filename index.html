@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes pop{
  0%{
    transform:scale(.7);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes confetti{
  0%{
    transform:translateY(0) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(52px) rotate(260deg);
    opacity:0
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(243,189,61,.75)
  }

  100%{
    box-shadow:0 0 0 10px rgba(243,189,61,0)
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg)
  }
}

@keyframes spark{
  0%{
    transform:scale(.4) translateY(8px);
    opacity:0
  }

  30%{
    opacity:1
  }

  100%{
    transform:scale(1.2) translateY(-22px);
    opacity:0
  }
}

.animate-floaty{
  animation:floaty 3.4s ease-in-out infinite
}

.animate-pop{
  animation:pop .25s ease-out both
}

.animate-wiggle{
  animation:wiggle .45s ease-in-out
}

.hint-pulse{
  animation:pulse-ring 1s ease-out infinite
}

.confetti-piece{
  position:absolute;
  width:7px;
  height:11px;
  border-radius:2px;
  animation:confetti .95s ease-in forwards;
  pointer-events:none
}

.spark-note{
